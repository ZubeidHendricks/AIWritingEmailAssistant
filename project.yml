# Generated by AppFactoryKit appgen. Run: xcodegen generate
name: AIWritingEmailAssistant
options:
  bundleIdPrefix: com.zubeid
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  AppFactoryKit:
    url: https://github.com/ZubeidHendricks/AppFactoryKit
    exactVersion: "0.1.2"

targets:
  AIWritingEmailAssistant:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    dependencies:
      - package: AppFactoryKit
        product: AppFactoryKit
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: "Writing Assistant"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_NAME: AIWritingEmailAssistant
        PRODUCT_BUNDLE_IDENTIFIER: com.zubeid.aiwriting
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  AIWritingEmailAssistantTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - path: Sources/WritingService.swift
    settings:
      base:
        PRODUCT_NAME: AIWritingEmailAssistantTests
        PRODUCT_BUNDLE_IDENTIFIER: com.zubeid.aiwritingemailassistant.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"

schemes:
  Tests:
    build:
      targets:
        AIWritingEmailAssistantTests: [test]
    test:
      targets:
        - AIWritingEmailAssistantTests
